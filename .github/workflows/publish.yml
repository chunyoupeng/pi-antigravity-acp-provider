name: Publish npm package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository_owner == 'zacbemis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@latest
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run check
      - run: npm run pack:check
      - run: npm run test:packed
      - run: npm audit --audit-level=moderate
      - name: Check whether this version is already published
        id: registry
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          versions=$(npm view "$name" versions --json)
          if node -e 'process.exit(JSON.parse(process.argv[1]).includes(process.argv[2]) ? 0 : 1)' "$versions" "$version"; then
            published=$(npm view "$name@$version" dist.shasum)
            local_shasum=$(npm pack --dry-run --ignore-scripts --json | node -e 'let s = ""; process.stdin.on("data", c => s += c).on("end", () => { const data = JSON.parse(s); const pack = Array.isArray(data) ? data[0] : data[process.argv[1]]; if (!pack?.shasum) throw new Error("Missing package shasum"); console.log(pack.shasum) })' "$name")
            if [ "$published" != "$local_shasum" ]; then
              echo "Published $name@$version differs from this tag; refusing to skip" >&2
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published with matching contents"
          fi
      - if: steps.registry.outputs.published != 'true'
        run: npm publish --access public
