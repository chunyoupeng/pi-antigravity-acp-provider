name: Update Antigravity runtime manifest

on:
  workflow_dispatch:
    inputs:
      publication_test:
        description: "Verify bot PR/CI publication without changing main or downloading artifacts"
        type: boolean
        default: false
      merge_publication_test:
        description: "Also merge the whitespace-only publication check through normal protection"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: antigravity-runtime-manifest
  cancel-in-progress: false

jobs:
  update:
    if: github.repository_owner == 'zacbemis'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Read and verify official release artifacts
        if: ${{ inputs.publication_test != true }}
        run: node scripts/refresh-runtime-manifest.mjs
      - name: Prepare publication check with the existing signed catalog
        if: ${{ inputs.publication_test == true }}
        run: printf '\n' >> runtime-manifest.json
      - name: Sign changed manifest
        if: ${{ inputs.publication_test != true && hashFiles('runtime-manifest.json') != '' }}
        env:
          RUNTIME_MANIFEST_PRIVATE_KEY: ${{ secrets.ACP_RUNTIME_MANIFEST_PRIVATE_KEY }}
        run: |
          if git diff --quiet -- runtime-manifest.json; then
            echo "The signed manifest is already current."
            exit 0
          fi
          if [ -z "$RUNTIME_MANIFEST_PRIVATE_KEY" ]; then
            echo "ACP_RUNTIME_MANIFEST_PRIVATE_KEY is required to publish a runtime update." >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/runtime-manifest-private.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$RUNTIME_MANIFEST_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ACP_RUNTIME_MANIFEST_PRIVATE_KEY_PATH="$key_file" npm run sign:runtime-manifest
      - name: Verify signed catalog
        run: npx vitest run test/runtime-manifest.test.ts
      - name: Publish signed manifest through a checked PR
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_PUBLICATION_TEST: ${{ inputs.publication_test || false }}
          RUNTIME_PUBLICATION_TEST_MERGE: ${{ inputs.merge_publication_test || false }}
        run: node scripts/publish-runtime-manifest.mjs
